name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: 离线单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: 运行离线测试
        # 测试工程是控制台断言器（不是 xUnit），所以用 run 而不是 test
        run: dotnet run --project tests/ZedUaOfflineTests/ZedUaOfflineTests.csproj -c Release

  version-consistency:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验 Directory.Build.props / Plugin.cs / CHANGELOG
        run: bash tools/ci/check-version.sh

  docs-links:
    name: 文档链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验 Markdown 相对链接
        run: python3 tools/ci/check_links.py

  ui-text:
    name: UI 文案一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验本地化表与引用
        run: python3 tools/ci/check_localization.py

  config-docs:
    name: 配置文档一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验 docs/CONFIG.md 覆盖全部配置项
        run: python3 tools/ci/check_config_docs.py